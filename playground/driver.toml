[[solver]]
name = "baseline" # Arbitrary name given to this solver, must be unique
endpoint = "http://baseline"
absolute-slippage = "40000000000000000" # Denominated in wei, optional
relative-slippage = "0.1" # Percentage in the [0, 1] range
account = "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6" # Known test private key

[[solver]]
name = "pysolver" # Arbitrary name given to this solver, must be unique
endpoint = "http://pysolver"
absolute-slippage = "40000000000000000" # Denominated in wei, optional
relative-slippage = "0.1" # Percentage in the [0, 1] range
account = "0xdbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97" # Known test private key

[submission]
gas-price-cap = "1000000000000"

[[submission.mempool]]
mempool = "public"

[liquidity]
base-tokens = [
    "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174", # USDCe on Polygon
]

[[liquidity.uniswap-v2]]
# SushiSwap V2 router on Polygon (manual config to avoid chain-specific preset lookup).
router = "0x1b02da8cb0d097eb8d57a175b88c7d8b47997506"
# SushiSwap V2 pair init code hash.
pool-code = "0xe18a34eb0e04b04f7a0ac29a6e80748dca96319b42c54d679cb821dca90c6303"
# Keep empty-pair misses cached to reduce repeated failed pool lookups.
missing-pool-cache-time = "1h"
