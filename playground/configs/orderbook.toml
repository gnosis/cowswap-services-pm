eip1271-skip-creation-validation = true
bind-address = "0.0.0.0:80"

[shared]
node-url = "http://chain:8545"
simulation-node-url = "http://chain:8545"

[shared.tracing]
collector-endpoint = "http://tempo:4317"

[database]
write-url = "%DB_WRITE_URL"
read-url = "%DB_READ_URL"

[native-price-estimation]
estimators = [[{ type = "Driver", name = "baseline", url = "http://driver/baseline" }]]

[order-quoting]
# price-estimation-drivers = [{ name = "baseline", url = "http://driver/baseline" }]
price-estimation-drivers = [{ name = "pysolver", url = "http://driver/pysolver" }]

[price-estimation]
# Skip verification for migration tokens since pysolver provides virtual liquidity
# that doesn't exist in standard DEX pools
tokens-without-verification = [
  "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174",  # USDC.e on Polygon
  "0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270",  # WPOL on Polygon
  "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359",  # USDC on Polygon
  "0x73edDFa87C71ADdC275c2b9890f5c3a8480bC9E6",  # stataPolUSDCn on Polygon
]
